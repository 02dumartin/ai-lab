[project]
name = "ai-lab"
version = "0.1.0"
description = "Multi-task AI tutorials and experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "monai>=1.5.2",
    "nibabel>=5.4.2",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.0",
    "sentencepiece>=0.2.2",
    "tensorflow>=2.21.0",
    "tensorflow-datasets>=4.9.10",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.14.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
